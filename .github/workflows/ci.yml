name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Tests use a fake embedder + fake LLM, so torch / API keys aren't needed.
      - name: Install test dependencies
        run: |
          pip install "langchain-core>=0.3" "langchain-text-splitters>=0.3" "langchain-chroma>=0.2" \
                      "langchain-groq>=0.2" "chromadb>=0.5" "pypdf>=5.0" python-dotenv streamlit \
                      pytest pytest-cov ruff fpdf2
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q --cov=documind --cov-report=term-missing
